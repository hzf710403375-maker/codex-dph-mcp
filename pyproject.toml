[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-dph-mcp"
version = "0.1.0"
description = "Local Codex to DeepSeek Harness task handoff"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["psutil>=6,<8", "mcp>=1.12,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
codex-dph = "codex_dph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_dph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
